    <!--
      Inter is loaded here rather than via @import in index.css: a CSS
      @import placed after @import 'tailwindcss' is silently dropped by the
      optimizer, because @import rules must precede all other rules.
      Google Fonts serves this with CORS headers, unlike the old
      static.figma.com URLs which browsers reject cross-origin.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    />
  </head>
